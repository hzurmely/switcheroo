name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" dist/Switcheroo-Setup-*.exe dist/latest.yml dist/*.blockmap --repo "$GITHUB_REPOSITORY" --title "Switcheroo $TAG" --notes "Windows 11 app. Download the installer and run it. New: automatic updates. The app now updates itself from here."
