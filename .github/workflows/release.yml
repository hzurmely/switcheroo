name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Switcheroo-Setup-*.exe dist/latest.yml dist/*.blockmap --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/Switcheroo-Setup-*.exe dist/latest.yml dist/*.blockmap --repo "$GITHUB_REPOSITORY" --title "Switcheroo $TAG" --notes "Windows 11 app. Download the installer and run it. New: automatic updates. The app now updates itself from here."
          fi

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
      - name: Attach Mac builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  winget:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: hzurmely.Switcheroo
          installers-regex: 'Setup.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
